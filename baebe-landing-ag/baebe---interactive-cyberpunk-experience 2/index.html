<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAEBE | System Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Scanlines */
    .scanlines {
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* Rolling Interference */
    @keyframes roll {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100vh);
      }
    }

    .rolling-bar {
      position: fixed;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.05), transparent);
      animation: roll 8s linear infinite;
      pointer-events: none;
      z-index: 51;
    }

    @keyframes cursor-blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .cursor-blink {
      animation: cursor-blink 1s step-end infinite;
    }

    @keyframes glitch {
      0% {
        transform: translate(0)
      }

      20% {
        transform: translate(-2px, 2px)
      }

      40% {
        transform: translate(-2px, -2px)
      }

      60% {
        transform: translate(2px, 2px)
      }

      80% {
        transform: translate(2px, -2px)
      }

      100% {
        transform: translate(0)
      }
    }

    .animate-glitch {
      animation: glitch 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
    }

    .text-glow {
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Custom Animations */
    @keyframes scan-on {
      0% {
        clip-path: inset(0 0 100% 0);
        opacity: 0;
      }

      100% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }
    }

    .animate-scan-on {
      animation: scan-on 2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }

    @keyframes float-3d {

      0%,
      100% {
        transform: rotateY(-10deg) rotateX(5deg);
      }

      50% {
        transform: rotateY(10deg) rotateX(-5deg);
      }
    }

    .animate-float-3d {
      animation: float-3d 8s ease-in-out infinite;
    }

    @keyframes scanline {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 0 100%;
      }
    }

    .animate-scanline {
      animation: scanline 0.2s linear infinite;
    }

    @keyframes scan-down {
      0% {
        top: -10%;
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      100% {
        top: 110%;
        opacity: 0;
      }
    }

    .animate-scan-down {
      animation: scan-down 3s linear infinite;
    }

    /* Utilities */
    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .pixelated {
      image-rendering: pixelated;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

</head>

<body>

  <div class="rolling-bar"></div>

</html>

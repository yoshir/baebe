<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>BAEBE — Reader</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BAEBE" />
  </head>
  <body class="login-body">
    <main class="login-card" role="main">
      <h1 class="login-title">BAEBE</h1>
      <p class="login-sub">Private reading copy</p>

      <form method="post" action="/login" class="login-form" autocomplete="off">
        <label for="pw" class="visually-hidden">Access code</label>
        <input
          id="pw"
          name="password"
          type="password"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Access code"
          required
        />
        <button type="submit">Enter</button>
      </form>

      <p id="err" class="login-error" hidden>Incorrect access code.</p>

      <p class="login-legal">
        © <span id="yr"></span> Ryan Yoshimoto. All rights reserved.<br />
        Unauthorized reproduction, redistribution, or sharing prohibited.
      </p>
    </main>

    <script>
      document.getElementById('yr').textContent = new Date().getFullYear();
      if (new URLSearchParams(location.search).get('error')) {
        document.getElementById('err').hidden = false;
      }
    </script>
  </body>
</html>
